version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: keepsong-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: keepsong
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keepsong"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: keepsong-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/keepsong
      - JWT_SECRET=supersecretjwtkeyforlocaldevelopment123!
      - ASR_API_KEY=mock_asr_key
      - NIM_API_KEY=mock_nim_key
      - NIM_BASE_URL=https://integrate.api.nvidia.com/v1
      - WEATHER_API_KEY=mock_weather_key
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: keepsong-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  postgres_data:
